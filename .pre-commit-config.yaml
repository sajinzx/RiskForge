repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format --check
        language: system
        types: [python]
      - id: no-ai-attribution
        name: reject AI attribution in commit messages
        entry: scripts/hooks/commit-msg
        language: script
        stages: [commit-msg]
