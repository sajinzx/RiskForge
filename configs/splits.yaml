# Chronological splits on forecast ISSUE time (implementation.md section 7.4). Never shuffled.
# Test data is read only by final experiment runs, never by tuning (assert_not_test guards this).
train_start: "2018-01-01"
calib_start: "2023-01-01"
test_start: "2024-01-01"
test_end: "2026-09-30"
# --smoke runs use this shortened layout so they finish in a minute.
smoke:
  train_start: "2021-01-01"
  calib_start: "2022-07-01"
  test_start: "2023-01-01"
  test_end: "2023-06-30"

# Weather-covariate comparison (F3 vs F4): archived forecasts start 2024-03, so both models are
# trained, calibrated and tested on this shorter, identical split (implementation.md section 7.4).
weather:
  train_start: "2024-04-01"
  calib_start: "2025-04-01"
  test_start: "2025-09-01"
  test_end: "2026-09-30"
weather_smoke:
  train_start: "2021-01-01"
  calib_start: "2021-10-01"
  test_start: "2022-01-01"
  test_end: "2022-03-31"
